# QA reference set v0 (implementation plan, Stage 1).
# Two kinds of questions:
#   positive — general automotive knowledge a correct answer must contain (expect_any)
#   negative — model-specific values NOT in the base yet: the agent must NOT invent
#              them and must mark the answer (refusal / "general practice" marker).
# Every stage change of provider or index must be followed by a QA run.

questions:
  # ---------- positive: general knowledge ----------
  - q: "Расшифруй код ошибки OBD-II P0300."
    expect_any: ["пропуск"]
  - q: "Расшифруй код ошибки OBD-II P0171."
    expect_any: ["бедн"]
  - q: "Какой хладагент используется в кондиционерах легковых автомобилей после 2017 года?"
    expect_any: ["1234yf"]
  - q: "Какой хладагент использовался в автомобильных кондиционерах до перехода на новый стандарт?"
    expect_any: ["134a"]
  - q: "Каким инструментом измеряют момент затяжки резьбовых соединений?"
    expect_any: ["динамометрич"]
  - q: "Что измеряет лямбда-зонд?"
    expect_any: ["кислород", "o2"]
  - q: "Сколько символов в VIN и что означает аббревиатура?"
    expect_any: ["17"]
  - q: "Какое приблизительное напряжение в бортовой сети легкового автомобиля при работающем генераторе?"
    expect_any: ["13", "14"]
  - q: "Что означает маркировка моторного масла 5W-30?"
    expect_any: ["вязк", "вязкост", "температур", "зим"]
  - q: "Почему ступичную гайку после откручивания обычно заменяют на новую?"
    expect_any: ["однораз", "деформ", "замен", "самоконтр"]
  - q: "Чем антифриз G13 отличается от G12 по основе?"
    expect_any: ["глицерин", "пропилен"]
  - q: "Что такое обрыв ремня ГРМ и чем он опасен для двигателя?"
    expect_any: ["клапан"]

  # ---------- negative: model-specific values missing from the base ----------
  - q: "Какой момент затяжки болтов ГБЦ у Skoda Rapid 1.6 MPI? Назови точное значение в Нм."
    expect_any: ["нет данных", "не найд", "нет точн", "сверься", "мануал", "общей практики", "уточнит"]
  - q: "Заправочный объём масла в двигателе Changan CS95 2.0T с фильтром — назови точное число литров."
    expect_any: ["нет данных", "не найд", "нет точн", "сверься", "мануал", "общей практики", "уточнит"]
  - q: "Момент затяжки свечей зажигания на VW Polo седан 1.6 CFNA — точное значение?"
    expect_any: ["нет данных", "не найд", "нет точн", "сверься", "мануал", "общей практики", "уточнит"]
  - q: "Дай распиновку разъёма StarLine S96v2 по контактам."
    expect_any: ["нет данных", "не найд", "нет точн", "сверься", "мануал", "общей практики", "уточнит"]
  - q: "Через сколько км по регламенту менять ремень ГРМ на Skoda Rapid 1.6 MPI? Точную цифру."
    expect_any: ["нет данных", "не найд", "нет точн", "сверься", "мануал", "общей практики", "уточнит"]
