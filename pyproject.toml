[project]
name = "auto-mechanic-ai"
version = "0.1.0"
description = "Personal AI assistant core for a car service: OpenAI-compatible API over pluggable LLM providers, RAG comes in Stage 3"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pymupdf>=2.2",
  "pdfplumber>=0.11.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
